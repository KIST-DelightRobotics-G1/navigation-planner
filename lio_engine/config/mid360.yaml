/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./test.pcd"

    common:
      lid_topic: "/livox/lidar"       # our driver publishes CustomMsg here (not /livox/custom_msg)
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1                    # 1 = Livox CustomMsg
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3                # 3 = nanoseconds
      scan_rate: 10

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: true
      extrinsic_T: [-0.011, -0.02329, 0.04412]   # Mid-360 imu<->lidar (datasheet)
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: true           # /cloud_registered_1 = FULL undistorted scan (~20k pts) for a dense obstacle map
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true                # test: does this branch actually write a PCD? (was "dead")
      interval: -1                     # -1 = accumulate the whole run into one file
