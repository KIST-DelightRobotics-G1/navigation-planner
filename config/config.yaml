# kist-navigation-planner — single config file, one section per stage
# (same convention as kist-gearsonic-inference's config/config.yaml;
#  sections are added as stages are implemented)

unitree:
  # DDS domain id (default 0; change to isolate multiple robots on one network)
  domain_id: 0
  # DDS transport config (XML): the network interface AND the socket-buffer /
  # defrag tuning live THERE — edit config/cyclonedds.xml to change the NIC.
  # (Why not here: the SDK ignores CYCLONEDDS_URI when an interface is passed in
  # code, so the runners route everything through the XML — see common/dds_config.hpp.)
  dds_config: config/cyclonedds.xml

pose_filter:
  # UWB + odometry EKF fusion (UwbOdomAEKF). Output frame + filter tuning.
  # Every key is optional — omitted keys fall back to the defaults below,
  # which match the onboard reference. Re-tune on the G1.
  frame_id: map

  # Safety: gate the pose off if no fresh UWB fix arrives within this window
  # (ms). Short between-fix gaps are normal EKF coasting; this catches a real
  # UWB outage. 0 disables. Matches the UWB subscriber's stale cadence.
  uwb_timeout_ms: 1000

  # Yaw-bias calibration persistence. The calibrated bias is saved to
  # yaw_state_file on shutdown. yaw_init: true (default) ignores it and
  # recalibrates from motion each run — safe. false reuses the saved bias to
  # skip the drive-to-calibrate step, valid ONLY if the robot's odom is
  # continuous across the restart (no reboot, didn't rotate while off).
  yaw_init: true
  yaw_state_file: state/pose_yaw_bias.txt

  # Process noise (Q)
  q_xy_m2_per_m: 0.001          # x/y process noise (m^2 per m travelled)
  q_bias_rad2_per_step: 1.0e-9  # yaw-bias random walk per step

  # Initial covariance (P)
  p_init_xy_m2: 1.0
  p_init_bias_rad2: 9.8696044   # pi^2 — yaw bias fully unknown at init

  # Adaptive measurement noise R (Sage-Husa)
  r_init_m2: 0.25
  r_min_m2: 0.002
  r_max_m2: 25.0
  forget_b: 0.98
  warmup_steps: 20

  # Yaw-bias std (deg) below which the pose is considered calibrated and
  # starts publishing.
  bias_calibrated_std_deg: 5.0

cv_inference:
  # Camera-driven YOLO inference. One camera + one rate are shared across the CV
  # tasks (instance / semantic) — a single inference runs at a time, so these
  # aren't per-task. Only the model path differs per task.
  camera: head              # which camera's DDS topics to consume (rt/kist/camera/<camera>/...)
  # Worker inference-rate cap (fps). 0 (or negative) = no cap: run as fast as the
  # camera/GPU allow. Positive values throttle the worker to that rate.
  target_fps: 30
  instance_onnx: models/yolo26l-seg.onnx   # YOLO26 instance-seg (proto masks)
  semantic_onnx: models/yolo26l-sem.onnx   # YOLO26 semantic-seg (dense class map)
  # Instance-seg detection confidence cut — drops detections below this. Higher
  # = fewer but surer labels in the fused cloud/grid; lower = more, noisier.
  score_threshold: 0.25

fusion:
  # depth + semantic mask -> labeled 3D cloud (fusion/depth_fusion.hpp), lifted
  # into the robot base frame by the camera extrinsics below.

  # Camera -> robot-base mount pose. ESTIMATE — tune live in test_fusion_viewer
  # (w/s pitch, e/d height) and copy the printed values back here. Camera optical
  # frame (+X right, +Y down, +Z forward) -> robot base (+X forward, +Y left, +Z up).
  camera_extrinsics:
    # Tuned live in test_fusion_viewer against the head D435 (floor flat on z=0).
    x: 0.0            # camera position in the robot frame (m, +forward)
    y: 0.0            # (m, +left)
    height: 1.24      # camera height above the floor (z, m)
    pitch_deg: 45.0   # downward tilt from horizontal (positive = looking down)
    yaw_deg: 0.0
    roll_deg: 0.0

  height_filter:
    # Keep the obstacle band, drop floor + overhead. Toggle live with the
    # viewer's 'x' key; on by default now that the tilt is calibrated.
    enabled: true
    min_z: 0.4
    max_z: 3.0

occupancy_grid:
  # Probabilistic semantic grid fusing the LiDAR + labeled camera clouds.
  # Robot-centered, top-down. P(occ) via log-odds; class via camera votes.
  half_extent_m: 5.0     # grid covers [-5, +5] m in X and Y
  resolution_m: 0.05     # 5cm cells -> 200x200
  min_z: 0.2             # obstacle height band (robot frame)
  max_z: 1.8

  # Inverse sensor model — log-odds added per hit (how much each sensor is
  # trusted). Camera trust falls from _near to _far as range -> cam_d_max, since
  # far stereo depth is noisy. LiDAR is a flat, higher trust.
  l_hit_lidar: 0.85
  l_hit_cam_near: 1.10
  l_hit_cam_far: 0.20
  cam_d_max: 4.0

  # Temporal decay toward P=0.5 (old hits fade). A cell decays fast when its
  # class is dynamic (people move -> short memory, no smear trail), slow otherwise
  # (walls persist -> long memory). Higher = longer memory.
  decay_static: 0.98
  decay_dynamic: 0.85
  dynamic_classes: [0]   # COCO class ids treated as dynamic (0 = person)

  occ_threshold: 0.81    # P(occ) above which a cell reads "occupied"

  # Object clustering (connected components on occupied cells). Grouping is
  # geometric (LiDAR + camera); the class is the cluster's majority label.
  cluster_min_area_m2: 0.05   # drop blobs smaller than this
  cluster_morph_cells: 1      # morphological-close radius (cells) to bridge gaps; 0 = off
  # Class tagging (camera labels only a surface -> judge among labelled cells):
  cluster_min_labeled_frac: 0.10  # labelled cells must be >= this frac of the cluster (presence)
  cluster_label_min_frac: 0.50    # top class must be >= this frac of the LABELLED cells (consensus)

pointcloud_processor:
  # Runs on the reader's DDS receive thread (set_processor hook):
  # transform first, then filter on the transformed coordinates.
  # Starting values taken from route-planner's tuning — re-tune on the G1.

  # sensor frame -> planning frame: axis invert + offset
  transform:
    enabled: true
    offset_x: 0.0
    offset_y: 0.0
    offset_z: 1.2     # sensor mount height above ground
    invert_x: false
    invert_y: true
    invert_z: true

  filter:
    enabled: true
    enable_x: true    # keep a 20m x 20m working area
    min_x: -10.0
    max_x:  10.0
    enable_y: true
    min_y: -10.0
    max_y:  10.0
    enable_z: true    # keep the obstacle band, drop floor and ceiling
    min_z:  0.3
    max_z:  3.0
    enable_radius: true
    min_radius: 0.5   # drop robot-body returns around the origin (XY
