# kist-navigation-planner — runtime config.
#
# Scope: this file holds only what the running system actually READS — the DDS
# transport. The route-planner tuning (obstacle grid, costmap, A*, smoother) lives
# as calibrated defaults in the route_planner/ headers (ObstacleGridConfig,
# CostmapConfig, AStarConfig, RouteSmoothConfig); sweep them without rebuilding via
# the env overrides in test_obstacle_grid (MIN_H, LETHAL_R, W_CENTER, R_MAX, ...).
# A `route_planner:` YAML section can be added here later if we wire those configs
# to file. (The parked UWB/camera/fusion/nav sections were removed — see _parked/.)

unitree:
  # DDS domain id (default 0; change to isolate multiple robots on one network).
  domain_id: 0
  # DDS transport (XML): the network interface AND socket-buffer / defrag tuning
  # live in the XML, not here — edit config/cyclonedds.xml to change the NIC.
  # (The SDK ignores CYCLONEDDS_URI when an interface is passed in code, so the
  # runners route everything through the XML — see common/dds_config.hpp.)
  dds_config: config/cyclonedds.xml

# Named navigation destinations live in a SEPARATE catalog: config/destinations.yaml
# (loaded by goal_generation's DestinationPublisher + GoalCommandReceiver). The robot is
# commanded to one by name over rt/kist/nav/goal; see that file for the entries + dock tuning.

# Localization: relocalize the live LIO odom against a prior PCD map -> map->odom, so the
# map-frame destinations above land on the same physical spot every run. Missing prior_map =
# localization disabled (rviz odom goals still work).
#
# Seed (initial map<-odom guess for GICP): computed from UWB when available — the recorded
# map-origin UWB (sidecar maps/map.uwb, written by kist-map-recorder) vs the live boot fix
# gives the translation; you MATCH the boot heading so the yaw is seed.yaw_deg (usually 0).
#   seed{x,y,yaw_deg} : fixed fallback used when UWB / sidecar is unavailable. yaw_deg doubles
#                       as the map<-odom heading for the UWB seed (match your boot heading).
#   map_uwb_yaw_deg   : map<-UWB rotation applied to the UWB displacement. The UWB anchor axes are
#                       rotated ~90 deg from the odom/map axes (UWB x=left,y=back vs odom x=fwd,y=left),
#                       so this is ~90; verified by the map xy landing on the true pose (only yaw left).
localization:
  prior_map: maps/map.pcd      # written by kist-map-recorder (+ maps/map.uwb sidecar)
  seed: { x: 0.0, y: 0.0, yaw_deg: 0.0 }
  map_uwb_yaw_deg: 90.0        # UWB axes ~90 deg rotated from odom (calibrated); fine-tune 88..92 if needed
  # Relocalizer accept gates (tunable without rebuild — restart to reload):
  fitness_max: 0.05      # LOCK only if GICP fitness (mean sq err, m^2) <= this (RMS ~sqrt); loose
                         # 0.30 accepts ~0.4m locks, 0.05 ~ RMS 0.22m — tighten for meaningful locks
  max_jump_m: 1.0        # reject a correction translating map->odom more than this (m)
  max_yaw_deg: 30        # reject a solution >this many deg from the seed heading (kills 180deg flips)
